[tool.poetry]
name = "moveyourass-backend"
version = "0.1.0"
description = "MoveYourAss backend"
authors = ["Konrad Wysokinski"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.115"
uvicorn = {extras = ["standard"], version = ">=0.32"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.36"}
asyncpg = ">=0.30"
alembic = ">=1.14"
pydantic-settings = ">=2.6"
google-auth = "^2.62.0"
pyjwt = "^2.15.1"
requests = "^2.34.2"
email-validator = "^2.3.0"
pillow = "^13.0.0"
python-multipart = "^0.0.33"
httpx = "^0.28.1"
firebase-admin = "^7.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
httpx = ">=0.28"
ruff = ">=0.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 79
extend-exclude = ["migrations/versions"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
