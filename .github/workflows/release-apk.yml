name: Release APK

# Builds a signed Android APK and publishes it as a GitHub Release.
#
# Automatic: every push to main that changes mobile/ gets the next patch
# version (latest vX.Y.Z tag + 1), is built, tested, signed and published.
# Put "[skip release]" in the commit message to skip it.
# Manual: for a bigger bump push a tag (git tag v0.2.0 && git push origin
# v0.2.0) or run it by hand (Actions -> Release APK -> Run workflow).
# After a manual bump the automatic releases continue from that version.
on:
  push:
    branches: [main]
    paths: ['mobile/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version without "v" (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    if: >-
      github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
      || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags: the next version is derived from them

      - name: Resolve version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            raw="$INPUT"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            raw="$REF_NAME"
          else
            # push to main: latest vX.Y.Z tag, patch + 1 (none yet: 0.1.0)
            last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
            if [ -z "$last" ]; then
              raw="0.1.0"
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              raw="$major.$minor.$((patch + 1))"
            fi
          fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$raw' is not X.Y.Z"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check required configuration
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for n in GS KS KSP KA KP; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          [ -z "${EXPO_PUBLIC_API_URL}" ] && missing="$missing vars.API_URL"
          [ -z "${EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID}" ] && missing="$missing vars.GOOGLE_WEB_CLIENT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets/variables:$missing (see mobile/RELEASE.md)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

      - name: Write google-services.json and keystore
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$GS" | base64 -d > google-services.json
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Generate native project
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build signed APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # arm64 only: every phone from the last ~8 years, half the build time
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Verify the signature is ours, not the debug key
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          cert="$("$apksigner" verify --print-certs "$apk" | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          want="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KSP" -alias "$KA" | grep 'SHA256:' | head -1 \
            | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "apk cert:      $cert"
          echo "keystore cert: $want"
          [ "$cert" = "$want" ] || { echo "::error::APK is not signed with the release key"; exit 1; }
          {
            echo "### Release key fingerprints (add SHA-1 to Firebase / Google OAuth)"
            keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KSP" -alias "$KA" | grep -E 'SHA1:|SHA256:'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          cp "$apk" "$RUNNER_TEMP/moveyourass-$VERSION.apk"
          # stable name -> .../releases/latest/download/moveyourass.apk
          cp "$apk" "$RUNNER_TEMP/moveyourass.apk"
          gh release create "$TAG" \
            "$RUNNER_TEMP/moveyourass-$VERSION.apk" \
            "$RUNNER_TEMP/moveyourass.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MoveYourAss $VERSION" --generate-notes
